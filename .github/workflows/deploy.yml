name: Deploy to GitHub Pages

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lib/wasm/target/
          key: ${{ runner.os }}-rust-${{ hashFiles('lib/wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Build WASM module
        run: npm run wasm-build

      - name: Set site URL and base path
        id: site-config
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SITE_URL }}" ]; then
            SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          else
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          echo "url=$SITE_URL" >> $GITHUB_OUTPUT
          
          # Determine base path: empty for custom domains, /themes-frontend for github.io
          if [[ "$SITE_URL" == *"github.io"* ]]; then
            BASE_PATH="/themes-frontend"
          else
            BASE_PATH=""
          fi
          echo "base_path=$BASE_PATH" >> $GITHUB_OUTPUT
          echo "BASE_PATH is set to: '$BASE_PATH'"

      - name: Build with Next.js
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ steps.site-config.outputs.url }}
          BASE_PATH: ${{ steps.site-config.outputs.base_path }}
          NEXT_PUBLIC_GOOGLE_FONTS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_FONTS_API_KEY }}
        run: |
          echo "Building with BASE_PATH: '$BASE_PATH'"
          echo "Building with NEXT_PUBLIC_SITE_URL: '$NEXT_PUBLIC_SITE_URL'"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

